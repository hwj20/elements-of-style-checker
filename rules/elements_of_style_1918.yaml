- id: VI-02
  ref: "Ch. VI: Doubling before -ed / -ing"
  section: VI
  title: A single consonant after a stressed short vowel is doubled before -ed and -ing (planned, letting, beginning; coming is an exception).
  name_zh: 重读短元音后的单辅音在 -ed/-ing 前双写
  severity: high
  status: active
  scope: sentence
  description: planned, letting, beginning, referring, occurred; but coming.
  misspellings:
    begining: beginning
    beginer: beginner
    occuring: occurring
    refering: referring
    refered: referred
    prefered: preferred
    prefering: preferring
    transfered: transferred
    transfering: transferring
    comitted: committed
    commited: committed
    comitting: committing
    commiting: committing
    admited: admitted
    admiting: admitting
    permited: permitted
    submited: submitted
    omited: omitted
    controled: controlled
    controling: controlling
    stoped: stopped
    stoping: stopping
    droped: dropped
    shiped: shipped

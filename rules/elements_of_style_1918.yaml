      suggestion: led
    - pattern: '\b(?:in|on|of|a\s+matter\s+of)\s+principal\b'
      action: verify
    - pattern: '\bprinciple\s+(?:reason|cause|investigator|component|source|aim|goal|author|actor|character|role|means|factor|part|city|sum|amount|difference)\b'

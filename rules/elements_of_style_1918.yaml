    geting: getting
    puting: putting
    runing: running
    swiming: swimming
    forgeting: forgetting
    regreted: regretted
    equiped: equipped
    comming: coming

- id: VI-03
  ref: "Ch. VI: to-day, to-night, to-morrow"
  section: VI
  title: Write to-day, to-night, to-morrow (but not together) with a hyphen.
  name_zh: to-day / to-night / to-morrow 加连字符（原书要求）
  severity: low
  status: outdated
  modern_note: Modern English writes today, tonight, tomorrow.
  scope: sentence
  description: 1918 spelling convention.
  triggers:
    - pattern: '\b(?:today|tonight|tomorrow)\b'
      action: report
      suggestion: to-day / to-night / to-morrow

- id: VI-04
  ref: "Ch. VI: any one, every one, some one, some time"
  section: VI
  title: Write any one, every one, some one, some time (except in the sense of "formerly") as two words.
  name_zh: any one / every one / some one 分写（原书要求）
  severity: low
  status: outdated
  modern_note: Modern English writes anyone, everyone, someone as one word.
  scope: sentence
  description: 1918 spelling convention.
  triggers:
    - pattern: '\b(?:anyone|everyone|someone)\b'
      action: report
      suggestion: any one / every one / some one
